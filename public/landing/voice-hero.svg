<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c18"/><stop offset="100%" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="g1"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <ellipse cx="400" cy="250" rx="280" ry="200" fill="url(#gw)" filter="url(#sg)"/>
  <!-- Central waveform area -->
  <rect x="160" y="100" width="480" height="300" rx="20" fill="#0d1525" stroke="#3b82f6" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Waveform visualization -->
  <g transform="translate(200,200)">
    <g opacity="0.15">
      <rect x="0" y="-40" width="4" height="80" rx="2" fill="#3b82f6"/>
      <rect x="12" y="-55" width="4" height="110" rx="2" fill="#3b82f6"/>
      <rect x="24" y="-30" width="4" height="60" rx="2" fill="#3b82f6"/>
      <rect x="36" y="-65" width="4" height="130" rx="2" fill="#3b82f6"/>
      <rect x="48" y="-45" width="4" height="90" rx="2" fill="#3b82f6"/>
      <rect x="60" y="-70" width="4" height="140" rx="2" fill="#818cf8"/>
      <rect x="72" y="-50" width="4" height="100" rx="2" fill="#818cf8"/>
      <rect x="84" y="-80" width="4" height="160" rx="2" fill="#818cf8"/>
      <rect x="96" y="-60" width="4" height="120" rx="2" fill="#818cf8"/>
    </g>
    <!-- Active waveform -->
    <g filter="url(#g1)">
      <rect x="120" y="-50" width="5" height="100" rx="2.5" fill="#3b82f6" opacity="0.8"/>
      <rect x="134" y="-75" width="5" height="150" rx="2.5" fill="#3b82f6" opacity="0.9"/>
      <rect x="148" y="-40" width="5" height="80" rx="2.5" fill="#60a5fa"/>
      <rect x="162" y="-85" width="5" height="170" rx="2.5" fill="#3b82f6"/>
      <rect x="176" y="-60" width="5" height="120" rx="2.5" fill="#818cf8"/>
      <rect x="190" y="-90" width="5" height="180" rx="2.5" fill="#6366f1" opacity="0.9"/>
      <rect x="204" y="-55" width="5" height="110" rx="2.5" fill="#818cf8" opacity="0.8"/>
    </g>
    <!-- Future (faded) -->
    <g opacity="0.12">
      <rect x="222" y="-45" width="4" height="90" rx="2" fill="#818cf8"/>
      <rect x="234" y="-60" width="4" height="120" rx="2" fill="#818cf8"/>
      <rect x="246" y="-35" width="4" height="70" rx="2" fill="#818cf8"/>
      <rect x="258" y="-50" width="4" height="100" rx="2" fill="#818cf8"/>
      <rect x="270" y="-40" width="4" height="80" rx="2" fill="#818cf8"/>
      <rect x="282" y="-55" width="4" height="110" rx="2" fill="#818cf8"/>
      <rect x="294" y="-30" width="4" height="60" rx="2" fill="#818cf8"/>
      <rect x="306" y="-45" width="4" height="90" rx="2" fill="#818cf8"/>
      <rect x="318" y="-35" width="4" height="70" rx="2" fill="#818cf8"/>
      <rect x="330" y="-50" width="4" height="100" rx="2" fill="#818cf8"/>
    </g>
    <!-- Playhead -->
    <line x1="216" y1="-100" x2="216" y2="100" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <circle cx="216" cy="-100" r="4" fill="#3b82f6"/>
  </g>
  <!-- Timer -->
  <text x="200" y="145" font-family="'SF Mono',monospace" font-size="11" fill="#3b82f6" opacity="0.6">00:12.4</text>
  <text x="540" y="145" font-family="'SF Mono',monospace" font-size="11" fill="#818cf8" opacity="0.3">02:00.0</text>
  <!-- Controls -->
  <g transform="translate(340,340)">
    <circle cx="0" cy="0" r="22" fill="#1a2540" stroke="#3b82f6" stroke-opacity="0.3"/>
    <polygon points="-6,-10 -6,10 10,0" fill="#3b82f6"/>
    <circle cx="-50" cy="0" r="14" fill="#1a2540" stroke="#3b82f6" stroke-opacity="0.15"/>
    <text x="-56" y="4" font-family="Inter,sans-serif" font-size="10" fill="#60a5fa">⟲</text>
    <circle cx="50" cy="0" r="14" fill="#1a2540" stroke="#3b82f6" stroke-opacity="0.15"/>
    <text x="44" y="4" font-family="Inter,sans-serif" font-size="10" fill="#60a5fa">⟳</text>
  </g>
  <!-- Side info cards -->
  <g transform="translate(40,110)">
    <rect width="100" height="80" rx="12" fill="#0d1525" stroke="#3b82f6" stroke-opacity="0.12"/>
    <text x="12" y="22" font-family="Inter,sans-serif" font-size="7" fill="#3b82f6" opacity="0.7" font-weight="600" letter-spacing="0.06em">CALLS SENT</text>
    <text x="12" y="46" font-family="Inter,sans-serif" font-size="20" fill="#60a5fa" font-weight="800">12.4K</text>
    <text x="12" y="62" font-family="Inter,sans-serif" font-size="8" fill="#22c55e">↑ 23% today</text>
  </g>
  <g transform="translate(40,210)">
    <rect width="100" height="80" rx="12" fill="#0d1525" stroke="#3b82f6" stroke-opacity="0.12"/>
    <text x="12" y="22" font-family="Inter,sans-serif" font-size="7" fill="#3b82f6" opacity="0.7" font-weight="600" letter-spacing="0.06em">PICKUP RATE</text>
    <text x="12" y="46" font-family="Inter,sans-serif" font-size="20" fill="#60a5fa" font-weight="800">87%</text>
    <text x="12" y="62" font-family="Inter,sans-serif" font-size="8" fill="#22c55e">↑ 5% weekly</text>
  </g>
  <g transform="translate(660,110)">
    <rect width="100" height="80" rx="12" fill="#0d1525" stroke="#3b82f6" stroke-opacity="0.12"/>
    <text x="12" y="22" font-family="Inter,sans-serif" font-size="7" fill="#3b82f6" opacity="0.7" font-weight="600" letter-spacing="0.06em">AVG DURATION</text>
    <text x="12" y="46" font-family="Inter,sans-serif" font-size="20" fill="#60a5fa" font-weight="800">34s</text>
    <text x="12" y="62" font-family="Inter,sans-serif" font-size="8" fill="#818cf8" opacity="0.5">optimal range</text>
  </g>
  <g transform="translate(660,210)">
    <rect width="100" height="80" rx="12" fill="#0d1525" stroke="#3b82f6" stroke-opacity="0.12"/>
    <text x="12" y="22" font-family="Inter,sans-serif" font-size="7" fill="#3b82f6" opacity="0.7" font-weight="600" letter-spacing="0.06em">UPTIME</text>
    <text x="12" y="46" font-family="Inter,sans-serif" font-size="20" fill="#60a5fa" font-weight="800">99.9%</text>
    <text x="12" y="62" font-family="Inter,sans-serif" font-size="8" fill="#22c55e">SLA guaranteed</text>
  </g>
  <!-- Floating dots -->
  <g filter="url(#g1)" opacity="0.6">
    <circle cx="130" cy="380" r="3" fill="#3b82f6"/><circle cx="680" cy="380" r="4" fill="#818cf8"/>
    <circle cx="300" cy="440" r="2" fill="#60a5fa"/><circle cx="500" cy="70" r="3" fill="#3b82f6"/>
  </g>
  <!-- Decorative rings -->
  <circle cx="680" cy="430" r="40" fill="none" stroke="#3b82f6" stroke-opacity="0.04"/><circle cx="680" cy="430" r="25" fill="none" stroke="#3b82f6" stroke-opacity="0.03"/>
</svg>