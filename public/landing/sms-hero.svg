<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080f0c"/><stop offset="100%" stop-color="#0a140f"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/><stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="g1"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <ellipse cx="400" cy="250" rx="300" ry="200" fill="url(#gw)" filter="url(#sg)"/>
  <!-- Central data flow visualization -->
  <!-- Source node left -->
  <g transform="translate(80,180)">
    <rect width="120" height="140" rx="14" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.12"/>
    <text x="14" y="24" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.7" font-weight="600" letter-spacing="0.06em">CAMPAIGN</text>
    <rect x="14" y="34" width="92" height="8" rx="4" fill="#10b981" opacity="0.08"/>
    <text x="20" y="41" font-family="Inter,sans-serif" font-size="6" fill="#10b981" opacity="0.5">Diwali Sale 2026</text>
    <rect x="14" y="50" width="92" height="8" rx="4" fill="#10b981" opacity="0.06"/>
    <text x="20" y="57" font-family="Inter,sans-serif" font-size="6" fill="#10b981" opacity="0.4">Summer Promo</text>
    <rect x="14" y="66" width="92" height="8" rx="4" fill="#10b981" opacity="0.04"/>
    <text x="20" y="73" font-family="Inter,sans-serif" font-size="6" fill="#10b981" opacity="0.3">Flash Deal</text>
    <text x="14" y="98" font-family="Inter,sans-serif" font-size="18" fill="#34d399" font-weight="800">50K</text>
    <text x="14" y="112" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.5">messages queued</text>
  </g>
  <!-- Flow lines from source -->
  <g opacity="0.3">
    <path d="M200,250 C260,250 280,180 340,180" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
    <path d="M200,250 C260,250 280,250 340,250" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M200,250 C260,250 280,320 340,320" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
  </g>
  <!-- Central processing hub -->
  <g transform="translate(320,170)">
    <rect width="160" height="160" rx="20" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.15"/>
    <text x="80" y="24" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.7" font-weight="600" letter-spacing="0.06em" text-anchor="middle">H2S ENGINE</text>
    <!-- Processing animation circles -->
    <circle cx="80" cy="80" r="40" fill="none" stroke="#10b981" stroke-opacity="0.08"/>
    <circle cx="80" cy="80" r="28" fill="none" stroke="#10b981" stroke-opacity="0.12"/>
    <circle cx="80" cy="80" r="16" fill="#10b981" opacity="0.15"/>
    <text x="73" y="84" font-family="Inter,sans-serif" font-size="12" fill="#34d399">⚡</text>
    <!-- Stats inside -->
    <text x="16" y="138" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.5">Throughput</text>
    <text x="16" y="150" font-family="Inter,sans-serif" font-size="10" fill="#34d399" font-weight="700">8.2K/sec</text>
    <text x="100" y="138" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.5">Latency</text>
    <text x="100" y="150" font-family="Inter,sans-serif" font-size="10" fill="#34d399" font-weight="700">&lt;200ms</text>
  </g>
  <!-- Flow lines to destinations -->
  <g opacity="0.3">
    <path d="M480,180 C520,180 540,150 600,150" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <path d="M480,250 C520,250 540,230 600,230" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M480,250 C520,250 540,310 600,310" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <path d="M480,320 C520,320 540,380 600,380" stroke="#10b981" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  </g>
  <!-- Moving particles on flow lines -->
  <circle r="3" fill="#34d399" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M200,250 C260,250 280,250 340,250"/>
  </circle>
  <circle r="2" fill="#10b981" opacity="0.6">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M480,250 C520,250 540,230 600,230"/>
  </circle>
  <!-- Destination nodes -->
  <g transform="translate(600,126)">
    <rect width="120" height="48" rx="10" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.12"/>
    <text x="12" y="18" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.6" font-weight="600">DELIVERED</text>
    <text x="12" y="36" font-family="Inter,sans-serif" font-size="16" fill="#34d399" font-weight="800">48.9K</text>
    <text x="80" y="36" font-family="Inter,sans-serif" font-size="9" fill="#22c55e">✓</text>
  </g>
  <g transform="translate(600,194)">
    <rect width="120" height="48" rx="10" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.12"/>
    <text x="12" y="18" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.6" font-weight="600">READ RATE</text>
    <text x="12" y="36" font-family="Inter,sans-serif" font-size="16" fill="#34d399" font-weight="800">73.2%</text>
  </g>
  <g transform="translate(600,262)">
    <rect width="120" height="48" rx="10" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.12"/>
    <text x="12" y="18" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.6" font-weight="600">CTR</text>
    <text x="12" y="36" font-family="Inter,sans-serif" font-size="16" fill="#34d399" font-weight="800">12.8%</text>
    <text x="72" y="36" font-family="Inter,sans-serif" font-size="9" fill="#22c55e">↑</text>
  </g>
  <g transform="translate(600,330)">
    <rect width="120" height="48" rx="10" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.12"/>
    <text x="12" y="18" font-family="Inter,sans-serif" font-size="7" fill="#10b981" opacity="0.6" font-weight="600">CONVERSIONS</text>
    <text x="12" y="36" font-family="Inter,sans-serif" font-size="16" fill="#34d399" font-weight="800">2,847</text>
  </g>
  <!-- Top stats bar -->
  <g transform="translate(120,40)">
    <rect width="560" height="36" rx="10" fill="#0c1a14" stroke="#10b981" stroke-opacity="0.08"/>
    <circle cx="16" cy="18" r="4" fill="#22c55e"/>
    <text x="26" y="22" font-family="'SF Mono',monospace" font-size="8" fill="#10b981" opacity="0.5">LIVE</text>
    <text x="70" y="22" font-family="Inter,sans-serif" font-size="8" fill="#34d399" opacity="0.7">48,923 delivered</text>
    <text x="210" y="22" font-family="Inter,sans-serif" font-size="8" fill="#34d399" opacity="0.4">•</text>
    <text x="222" y="22" font-family="Inter,sans-serif" font-size="8" fill="#34d399" opacity="0.7">DLT compliant</text>
    <text x="340" y="22" font-family="Inter,sans-serif" font-size="8" fill="#34d399" opacity="0.4">•</text>
    <text x="352" y="22" font-family="Inter,sans-serif" font-size="8" fill="#34d399" opacity="0.7">98.3% delivery rate</text>
  </g>
  <!-- Floating dots -->
  <g filter="url(#g1)" opacity="0.5">
    <circle cx="50" cy="100" r="3" fill="#10b981"/><circle cx="750" cy="80" r="3" fill="#34d399"/>
    <circle cx="50" cy="420" r="2" fill="#14b8a6"/><circle cx="750" cy="460" r="4" fill="#10b981"/>
  </g>
</svg>