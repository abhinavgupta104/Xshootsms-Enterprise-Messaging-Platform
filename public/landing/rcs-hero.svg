  <g filter="url(#g1)" opacity="0.7">
    <circle cx="120" cy="140" r="4" fill="#8b5cf6"/><circle cx="660" cy="90" r="3" fill="#a855f7"/>
    <circle cx="700" cy="350" r="5" fill="#7c3aed"/><circle cx="100" cy="380" r="3" fill="#c084fc"/>
  </g>
  <circle cx="100" cy="250" r="60" fill="none" stroke="#8b5cf6" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="100" cy="250" r="40" fill="none" stroke="#8b5cf6" stroke-opacity="0.03" stroke-width="1"/>
