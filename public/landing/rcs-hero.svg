  <rect x="315" y="340" width="52" height="16" rx="8" fill="none" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="323" y="351" font-family="Inter,sans-serif" font-size="6.5" fill="#a78bfa">Support</text>
  <rect x="372" y="340" width="52" height="16" rx="8" fill="none" stroke="#8b5cf6" stroke-opacity="0.3"/>
