      <rect x="8" y="24" width="8" height="10" rx="1" fill="#8b5cf6" opacity="0.4"/>
      <rect x="20" y="18" width="8" height="16" rx="1" fill="#8b5cf6" opacity="0.6"/>
      <rect x="32" y="12" width="8" height="22" rx="1" fill="#8b5cf6" opacity="0.8"/>
      <rect x="44" y="6" width="8" height="28" rx="1" fill="url(#ac)"/>
      <rect x="56" y="10" width="8" height="24" rx="1" fill="#a855f7" opacity="0.7"/>
