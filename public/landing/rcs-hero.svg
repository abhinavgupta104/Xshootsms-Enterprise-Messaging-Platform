  </g>
  <g transform="translate(520,286)">
    <rect width="180" height="68" rx="14" fill="#16141f" stroke="#8b5cf6" stroke-opacity="0.12"/>
    <text x="16" y="22" font-family="Inter,sans-serif" font-size="8" fill="#8b5cf6" opacity="0.6" font-weight="600" letter-spacing="0.06em">CTR LIFT</text>
